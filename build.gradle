buildscript {
    // The axion-release plugin (at its latest, 1.21.2) pulls Bouncy Castle 1.81/1.82 onto the
    // plugin classpath, below the 1.84 that fixes GHSA-p93r-85wp-75v3, -cj8j-37rh-8475,
    // -c3fc-8qff-9hwx and -wg6q-6289-32hp. Force the patched version until axion-release ships it.
    // Build-time only; not part of the published artifact.
    configurations.classpath {
        resolutionStrategy {
            force 'org.bouncycastle:bcprov-jdk18on:1.84',
                    'org.bouncycastle:bcpg-jdk18on:1.84',
                    'org.bouncycastle:bcpkix-jdk18on:1.84',
                    'org.bouncycastle:bcutil-jdk18on:1.84'
        }
    }
}

plugins {
    id 'java-library'
    id 'groovy'
    id 'com.vanniktech.maven.publish' version '0.34.0'
    id 'jacoco'
    id "pl.allegro.tech.build.axion-release" version "1.20.1"
    id "com.palantir.revapi" version "1.7.0"
//    id "net.ltgt.errorprone" version "2.0.2" apply false
    id "biz.aQute.bnd.builder" version "$bndVersion"
}

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url 'https://central.sonatype.com/repository/maven-snapshots/'
    }
}

java {
    sourceCompatibility = 11
    targetCompatibility = 11

    registerFeature('groovyDsl') {
        usingSourceSet(sourceSets.main)
    }
}

dependencies {
    api libs.ical4j, libs.commons.io

    groovyDslImplementation libs.groovy

    // junit
    testImplementation libs.junit.jupiter

    // groovy-test
    testImplementation libs.groovy.test

    // spock
    testImplementation platform(libs.spock.bom), libs.spock.core, libs.log4j.core, libs.log4j.slf4j2

    testRuntimeOnly libs.junit.platform

    testRuntimeOnly(libs.ical4j) {
        capabilities {
            requireCapability("org.mnode.ical4j:ical4j-filter-expressions")
        }
    }
}

test {
    useJUnitPlatform()

    finalizedBy jacocoTestCoverageVerification, jacocoTestReport // Ensure Jacoco is run after tests have completed
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.7
            }
            failOnViolation = false
        }
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = jacoco_htmlReport == 'true'
    }
}

javadoc {
    if (JavaVersion.current().isJava8Compatible()) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    options {
        links 'https://docs.oracle.com/en/java/javase/11/docs/api/',
                'https://javadoc.io/doc/org.mnode.ical4j/ical4j/latest'
    }
}

scmVersion {
    tag {
        prefix = 'ical4j-vcard-'
        branchPrefix = ['ical4j-vcard-1.x-maintenance': 'jdk8_ical4j_vcard']
    }
    versionCreator 'versionWithBranch'
    branchVersionCreator = ['master': 'simple']
    branchVersionCreator = ['ical4j-vcard-1.x-maintenance': 'simple']
    branchVersionCreator = ['develop': 'simple']
    nextVersion {
        suffix = 'pre'
        separator = '-'
    }
}

group = 'org.mnode.ical4j'
description = 'Support for the vCard specification'
version = scmVersion.version

jar {
    manifest {
        attributes(
                'Implementation-Title': 'iCal4j vCard',
                'Implementation-Version': version,
                'Implementation-Vendor': 'Ben Fortuna'
        )
    }
}

revapi {
    oldVersion = revApiOldVersion
}

// Publishing to the Sonatype Central Portal is configured via the vanniktech plugin.
// Host, auto-release and signing toggles live in gradle.properties
// (SONATYPE_HOST, SONATYPE_AUTOMATIC_RELEASE, RELEASE_SIGNING_ENABLED).
// Credentials and the signing key are supplied via ORG_GRADLE_PROJECT_* env vars in CI.
mavenPublishing {
    coordinates(group.toString(), project.name, version.toString())

    pom {
        name = project.name
        description = project.description
        url = 'http://ical4j.github.io'

        licenses {
            license {
                name = 'iCal4j - License'
                url = 'https://raw.githubusercontent.com/ical4j/ical4j/master/LICENSE'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'fortuna'
                name = 'Ben Fortuna'
            }
        }

        scm {
            url = 'https://github.com/ical4j/ical4j-vcard'
            connection = 'scm:git@github.com:ical4j/ical4j-vcard.git'
            developerConnection = 'scm:git@github.com:ical4j/ical4j-vcard.git'
        }
    }
}
